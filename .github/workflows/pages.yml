name: Deploy Indonesian reader

on:
  push:
    branches: [main]
    paths:
      - output/html/**
      - scripts/manage-universal-reader-navigation.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Verify frozen reader bodies and universal navigation
        run: python scripts/manage-universal-reader-navigation.py check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload reader artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
