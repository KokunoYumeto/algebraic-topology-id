name: Deploy Indonesian reader

on:
  push:
    branches: [main]
    paths:
      - output/html/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Verify frozen readers
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "output/html/index.html": (85580, "5cc4a29f2c29b274328b574d6698a51d75af0939f9959937db8d679c38ad51b8"),
              "output/html/units-001-002/index.html": (220035, "d3b5cbfaa3511823821ecf9ba26a4eaec7c84d937417927d11bde3f66abc9f54"),
              "output/html/units-001-003/index.html": (359397, "33281cc46faa3d560c968b657526cd914786c991d1475b5563911a265bd316c1"),
              "output/html/units-001-004/index.html": (494732, "8c8f5e1ad8172a2d97e3931fc3b4f2a3aa7f9e8a709260a27103f7eca0f1357d"),
              "output/html/units-001-005/index.html": (610594, "8d3accf480101565409909c05f987f44b73f1c98889128e2f5074a4e049f48f3"),
              "output/html/units-001-007/index.html": (899803, "55135048eafe0f097c45936add885e008392eefdf475270fea37adf6a2a7b7bb"),
              "output/html/units-001-010/index.html": (1318415, "e228ac1422b2742d873feffd5b236fe9c1329d0bdb5da0e8deffe5e770361088"),
              "output/html/units-001-013/index.html": (1824804, "be1473ab5cb8eff26341e554179661775a12cec5784a8ebf3f9c2f3f0633cb71"),
              "output/html/units-001-019/index.html": (2962478, "ea5481b14dc1772408bd1c3e384b94a18eed9f2be3c9b9379fe4f8dd499253e0"),
              "output/html/units-001-020/index.html": (3190086, "59cb765f2291fc835ca629c774505303745983baacf5379efc97c49da6205c03"),
              "output/html/units-001-021/index.html": (3306661, "aec7e94d3697a7feeae87134da983c59faaf29dc8d961bca28b6bfa9c53cdfa6"),
              "output/html/units-001-022/index.html": (3520527, "15938aac7515e4ad7de66f8cf2d825744f9eb08b654165b835bfeace31aef8f4"),
              "output/html/units-001-023/index.html": (3707037, "536fbe19e295424d12198bf1b221be3e2f0170f87fa810a9125bcca9f742264b"),
              "output/html/units-001-024/index.html": (3927104, "28a84406de9e196070965920a7f7937177197977f9ddf118f0f8b07d464cbf0f"),
              "output/html/units-001-025/index.html": (4112563, "38cd8437f3b4235ac6269f4e3365123fa06485269d35a424ad4f5ddd589025c1"),
              "output/html/units-001-026/index.html": (4306392, "a9e4bea73cab5e90136822fbb94a11a1006f7e81ffcdf0a5740da52e335b4e3b"),
              "output/html/units-001-027/index.html": (4504569, "d98c2c29344e1e3cc3e81863e426fbf775ca6b70c0a5534d888d80ad2269486d"),
              "output/html/units-001-028/index.html": (4624723, "30f4821960a310bfb6f457f05838b6d8355e2a6df5c35b3a3dcdd9c1afa0a13e"),
              "output/html/units-001-029/index.html": (4751974, "67e5dd915cbbdf9b1961368efb1538b9ce0da8a4596d7ade11a4af051a189167"),
              "output/html/units-001-030/index.html": (4861791, "ed9da5653b3eacf7418d6e08760fcd2ecff4d75799c47f08689b940798099891"),
              "output/html/roberts-001-030-fomberg-001/index.html": (5029788, "2b64e8bec1dd5e1689ef6569360fec896ef87a683c7ba291a3780e27084a7390"),
              "output/html/roberts-001-030-fomberg-001-002/index.html": (5254038, "1f7618003e3ff273a4f1e2d97b5a81fd320f76640c475cae845ed38793fbeccd"),
          }
          for name, (size, digest) in expected.items():
              path = Path(name)
              data = path.read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert sha256(data).hexdigest() == digest, name
          actual = sorted(path.relative_to(Path("output/html")).as_posix() for path in Path("output/html").rglob("*") if path.is_file())
          assert actual == ["index.html", "roberts-001-030-fomberg-001-002/index.html", "roberts-001-030-fomberg-001/index.html", "units-001-002/index.html", "units-001-003/index.html", "units-001-004/index.html", "units-001-005/index.html", "units-001-007/index.html", "units-001-010/index.html", "units-001-013/index.html", "units-001-019/index.html", "units-001-020/index.html", "units-001-021/index.html", "units-001-022/index.html", "units-001-023/index.html", "units-001-024/index.html", "units-001-025/index.html", "units-001-026/index.html", "units-001-027/index.html", "units-001-028/index.html", "units-001-029/index.html", "units-001-030/index.html"], actual
          print("Frozen Roberts Unit 1-30 history and Roberts 30/30 plus Fomberg 1.1-1.4 HTML verified")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload reader artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
