name: Deploy Indonesian reader

on:
  push:
    branches: [main]
    paths:
      - output/html/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Verify frozen readers
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "output/html/index.html": (85580, "5cc4a29f2c29b274328b574d6698a51d75af0939f9959937db8d679c38ad51b8"),
              "output/html/units-001-002/index.html": (220035, "d3b5cbfaa3511823821ecf9ba26a4eaec7c84d937417927d11bde3f66abc9f54"),
              "output/html/units-001-003/index.html": (359397, "33281cc46faa3d560c968b657526cd914786c991d1475b5563911a265bd316c1"),
              "output/html/units-001-004/index.html": (494732, "8c8f5e1ad8172a2d97e3931fc3b4f2a3aa7f9e8a709260a27103f7eca0f1357d"),
              "output/html/units-001-005/index.html": (610594, "8d3accf480101565409909c05f987f44b73f1c98889128e2f5074a4e049f48f3"),
              "output/html/units-001-007/index.html": (899803, "55135048eafe0f097c45936add885e008392eefdf475270fea37adf6a2a7b7bb"),
              "output/html/units-001-010/index.html": (1318415, "e228ac1422b2742d873feffd5b236fe9c1329d0bdb5da0e8deffe5e770361088"),
              "output/html/units-001-013/index.html": (1824804, "be1473ab5cb8eff26341e554179661775a12cec5784a8ebf3f9c2f3f0633cb71"),
              "output/html/units-001-019/index.html": (2962478, "ea5481b14dc1772408bd1c3e384b94a18eed9f2be3c9b9379fe4f8dd499253e0"),
          }
          for name, (size, digest) in expected.items():
              path = Path(name)
              data = path.read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert sha256(data).hexdigest() == digest, name
          actual = sorted(path.relative_to(Path("output/html")).as_posix() for path in Path("output/html").rglob("*") if path.is_file())
          assert actual == ["index.html", "units-001-002/index.html", "units-001-003/index.html", "units-001-004/index.html", "units-001-005/index.html", "units-001-007/index.html", "units-001-010/index.html", "units-001-013/index.html", "units-001-019/index.html"], actual
          print("Frozen Unit 1 and cumulative Unit 1-2 through Unit 1-19 HTML verified")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload reader artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
