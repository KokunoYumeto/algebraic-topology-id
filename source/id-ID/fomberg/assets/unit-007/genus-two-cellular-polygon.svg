<?xml version="1.0" encoding="UTF-8"?>
<!--
  Independent accessible edition-original equivalent diagram for O012-FOM-007.
  Source reference: Yeheli Fomberg, algebraic_topology.tex, commit
  563194fae879178b9a6871b249513bfc27968975, lines 3852-3906 (CC BY-SA 4.0).
  This standard genus-two polygon is mathematically equivalent to, but is not
  a literal redraw of, the source's cyclic edge arrangement. Signed labels
  keep orientation intelligible without color; layout is reader-width-safe.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680"
     style="max-width:100%;height:auto" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="g2-title g2-desc" data-origin="edition-original"
     data-source-relation="equivalent-standard-polygon-not-literal-redraw"
     data-audit-id="o012-fom-u007-fig-genus-two-polygon" data-source-lines="3852-3906">
  <title id="g2-title">Poligon standar ekuivalen untuk permukaan genus dua</title>
  <desc id="g2-desc">Diagram asli edisi berupa oktagon standar dengan kata batas a b a invers b invers c d c invers d invers. Delapan verteks diidentifikasi menjadi satu verteks v dan interior adalah sel dua Delta. Model ini ekuivalen dengan poligon pada sumber, tetapi bukan gambar ulang literal susunan sisi sumber.</desc>
  <defs>
    <marker id="g2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111827"/>
    </marker>
    <pattern id="g2-hatch" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="15" height="15" fill="#fdf2f8"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="#f9a8d4" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1040" height="680" rx="18" fill="#ffffff"/>
  <text x="520" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#111827">Σ₂ sebagai hasil bagi sebuah oktagon</text>
  <polygon points="680,130 835,285 835,455 680,610 360,610 205,455 205,285 360,130"
           fill="url(#g2-hatch)" stroke="#374151" stroke-width="5"/>
  <g fill="none" stroke-width="9" stroke-linecap="round" marker-end="url(#g2-arrow)">
    <line x1="375" y1="130" x2="665" y2="130" stroke="#b91c1c"/>
    <line x1="695" y1="145" x2="820" y2="270" stroke="#1d4ed8"/>
    <line x1="835" y1="300" x2="835" y2="440" stroke="#b91c1c"/>
    <line x1="820" y1="470" x2="695" y2="595" stroke="#1d4ed8"/>
    <line x1="665" y1="610" x2="375" y2="610" stroke="#047857"/>
    <line x1="345" y1="595" x2="220" y2="470" stroke="#a21caf"/>
    <line x1="205" y1="440" x2="205" y2="300" stroke="#047857"/>
    <line x1="220" y1="270" x2="345" y2="145" stroke="#a21caf"/>
  </g>
  <g fill="#111827">
    <circle cx="680" cy="130" r="10"/><circle cx="835" cy="285" r="10"/>
    <circle cx="835" cy="455" r="10"/><circle cx="680" cy="610" r="10"/>
    <circle cx="360" cy="610" r="10"/><circle cx="205" cy="455" r="10"/>
    <circle cx="205" cy="285" r="10"/><circle cx="360" cy="130" r="10"/>
  </g>
  <g font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <text x="520" y="108" fill="#991b1b">a</text>
    <text x="790" y="183" fill="#1e40af">b</text>
    <text x="878" y="375" fill="#991b1b">a⁻¹</text>
    <text x="790" y="566" fill="#1e40af">b⁻¹</text>
    <text x="520" y="652" fill="#065f46">c</text>
    <text x="250" y="566" fill="#86198f">d</text>
    <text x="157" y="375" fill="#065f46">c⁻¹</text>
    <text x="250" y="183" fill="#86198f">d⁻¹</text>
    <text x="520" y="380" font-size="46" fill="#5b21b6">Δ</text>
  </g>
  <text x="520" y="82" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#374151">kata batas: aba⁻¹b⁻¹cdc⁻¹d⁻¹</text>
  <text x="520" y="675" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">Semua verteks ↦ v</text>
</svg>
