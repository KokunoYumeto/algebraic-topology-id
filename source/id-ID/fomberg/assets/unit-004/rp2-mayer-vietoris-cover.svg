<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520"
     style="max-width:100%;height:auto" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="rp2-title rp2-desc" data-source-lines="2555-2573">
  <title id="rp2-title">Penutup bidang proyektif real untuk Mayer–Vietoris</title>
  <desc id="rp2-desc">Cakram pusat A berwarna jingga. Daerah B berwarna biru berbentuk gelang yang menjadi pita Möbius setelah titik antipodal pada lingkaran luar diidentifikasi. Gelang ungu di antara dua lingkaran dalam adalah A irisan B. Dua anak panah berlawanan pada lingkaran luar menunjukkan identifikasi antipodal.</desc>
  <defs>
    <pattern id="rp2-blue" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="14" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#2563eb" stroke-width="3"/>
    </pattern>
    <pattern id="rp2-orange" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffedd5"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ea580c" stroke-width="3"/>
    </pattern>
    <marker id="rp2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#ffffff"/>
  <text x="340" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">ℝP² = int(A) ∪ int(B)</text>
  <circle cx="340" cy="270" r="190" fill="url(#rp2-blue)" stroke="#1d4ed8" stroke-width="5"/>
  <circle cx="340" cy="270" r="98" fill="url(#rp2-orange)" stroke="#c2410c" stroke-width="5"/>
  <circle cx="340" cy="270" r="58" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <path d="M340 172 A98 98 0 1 1 339.9 172" fill="none" stroke="#7c3aed" stroke-width="28" opacity="0.72"/>
  <circle cx="340" cy="270" r="112" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M340 80 A190 190 0 0 1 530 270" fill="none" stroke="#111827" stroke-width="5" marker-end="url(#rp2-arrow)"/>
  <path d="M340 460 A190 190 0 0 1 150 270" fill="none" stroke="#111827" stroke-width="5" marker-end="url(#rp2-arrow)"/>
  <circle cx="150" cy="270" r="8" fill="#111827"/>
  <circle cx="530" cy="270" r="8" fill="#111827"/>
  <text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#c2410c">A ≅ D²</text>
  <text x="450" y="142" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#1d4ed8">B ≃ pita Möbius</text>
  <text x="340" y="166" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#5b21b6">A ∩ B ≃ S¹</text>
  <text x="340" y="500" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">Anak panah luar: identifikasi antipodal berarah berlawanan</text>
</svg>
