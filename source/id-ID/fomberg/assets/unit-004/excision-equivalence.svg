<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430"
     style="max-width:100%;height:auto" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="excision-title excision-desc" data-source-lines="1942-1987">
  <title id="excision-title">Dua rumusan ekuivalen teorema eksisi</title>
  <desc id="excision-desc">Di kiri, Z terletak di dalam A dan A terletak di dalam X. Di kanan, X satu dan X dua menutupi X dengan daerah tumpang-tindih. Korespondensinya adalah A sama dengan X dua, Z sama dengan komplemen X satu, dan A tanpa Z sama dengan irisan X satu dan X dua.</desc>
  <defs>
    <pattern id="overlap-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ede9fe"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7c3aed" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="225" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">Bentuk daerah yang dibuang</text>
  <path d="M55 330 C18 244 58 102 197 73 C341 43 425 114 416 230 C408 344 298 388 151 371 C102 365 70 350 55 330 Z" fill="#f9fafb" stroke="#111827" stroke-width="5"/>
  <path d="M112 301 C87 228 119 131 218 112 C314 94 367 145 358 229 C348 308 281 337 187 329 C151 326 123 315 112 301 Z" fill="#ffedd5" stroke="#c2410c" stroke-width="5"/>
  <path d="M185 266 C169 228 185 176 234 165 C282 155 309 184 303 226 C298 270 262 286 217 280 C201 278 190 273 185 266 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <text x="82" y="123" font-family="sans-serif" font-size="28" font-weight="700" fill="#111827">X</text>
  <text x="137" y="166" font-family="sans-serif" font-size="28" font-weight="700" fill="#c2410c">A</text>
  <text x="232" y="231" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">Z</text>
  <text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#374151">⇔</text>
  <text x="730" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">Bentuk penutup</text>
  <path d="M548 337 C505 264 533 130 650 91 C746 59 819 105 826 213 C831 307 760 367 646 371 C598 372 565 360 548 337 Z" fill="#dbeafe" fill-opacity="0.9" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M665 354 C620 281 639 136 760 91 C862 54 928 116 914 233 C902 333 824 377 724 371 C696 370 675 364 665 354 Z" fill="#ffedd5" fill-opacity="0.86" stroke="#c2410c" stroke-width="5"/>
  <path d="M665 354 C620 281 639 136 760 91 C791 80 817 79 839 85 C821 110 813 151 816 213 C821 307 760 367 665 371 Z" fill="url(#overlap-hatch)" fill-opacity="0.78" stroke="none"/>
  <text x="584" y="145" font-family="sans-serif" font-size="27" font-weight="700" fill="#1d4ed8">X₁</text>
  <text x="860" y="152" font-family="sans-serif" font-size="27" font-weight="700" fill="#c2410c">X₂</text>
  <text x="747" y="242" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5b21b6">X₁ ∩ X₂</text>
  <line x1="305" y1="404" x2="652" y2="404" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="397" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">A = X₂,  Z = X ∖ X₁</text>
</svg>
