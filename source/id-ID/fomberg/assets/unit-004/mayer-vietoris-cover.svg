<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     style="max-width:100%;height:auto" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="mv-title mv-desc" data-source-lines="2445-2483">
  <title id="mv-title">Penutup Mayer–Vietoris dan pemotongan rantai</title>
  <desc id="mv-desc">Daerah A berwarna biru dan B berwarna jingga menutupi X. Irisan A dan B berwarna ungu. Suatu rantai z dipotong menjadi tau di A dan eta di B; kedua potongan mempunyai batas bersama dengan tanda berlawanan di irisan.</desc>
  <defs>
    <pattern id="mv-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ede9fe"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7c3aed" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">X = int(A) ∪ int(B)</text>
  <path d="M62 322 C18 243 58 107 206 73 C347 40 474 103 475 220 C475 338 348 381 196 368 C126 362 81 345 62 322 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M425 337 C376 252 415 112 574 71 C724 33 854 100 844 228 C836 345 714 382 557 370 C492 365 444 351 425 337 Z" fill="#ffedd5" stroke="#c2410c" stroke-width="5"/>
  <path d="M425 337 C392 280 400 197 452 137 C493 91 542 78 574 71 C637 55 696 57 744 77 C706 101 682 155 680 220 C678 315 597 360 494 364 C459 359 435 349 425 337 Z" fill="url(#mv-hatch)" fill-opacity="0.8" stroke="none"/>
  <text x="126" y="133" font-family="sans-serif" font-size="29" font-weight="700" fill="#1d4ed8">A</text>
  <text x="760" y="137" font-family="sans-serif" font-size="29" font-weight="700" fill="#c2410c">B</text>
  <text x="550" y="127" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5b21b6">A ∩ B</text>
  <path d="M126 288 C201 222 286 174 379 207 C421 222 460 238 504 218" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
  <path d="M504 218 C570 187 656 162 773 245" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="504" cy="218" r="10" fill="#7c3aed" stroke="#111827" stroke-width="2"/>
  <text x="278" y="185" font-family="sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">τ</text>
  <text x="647" y="183" font-family="sans-serif" font-size="25" font-weight="700" fill="#c2410c">η</text>
  <text x="450" y="408" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#374151">z = τ + η,  ∂τ = −∂η di A ∩ B</text>
</svg>
