  <title id="torus-title">Struktur CW minimal pada torus</title>
  <desc id="torus-desc">Sebuah persegi mempunyai sisi mendatar berlabel b dengan arah sama dan sisi tegak berlabel a dengan arah sama. Keempat sudut menjadi satu sel nol, sisi-sisinya menjadi dua sel satu a dan b, dan interior persegi menjadi satu sel dua yang dilekatkan menurut kata aba invers b invers.</desc>
