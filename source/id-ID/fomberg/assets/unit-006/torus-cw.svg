      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <pattern id="torus-fill" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#f5f3ff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#c4b5fd" stroke-width="3"/>
    </pattern>
  </defs>
