<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" width="1080" height="350"
     style="max-width:100%;height:auto" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="projective-title projective-desc" data-source-lines="3443-3516">
  <title id="projective-title">Filtrasi CW ruang projektif real dan kompleks</title>
  <desc id="projective-desc">Baris atas membangun ruang projektif real dengan menambahkan satu sel pada setiap dimensi. Baris bawah membangun ruang projektif kompleks dengan menambahkan satu sel pada setiap dimensi genap.</desc>
  <defs>
    <marker id="proj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1080" height="350" rx="18" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#111827">
    <text x="42" y="83" font-size="28" font-weight="700">Real:</text>
    <text x="30" y="230" font-size="25" font-weight="700">Kompleks:</text>
  </g>
  <g font-family="serif" font-size="34" fill="#1e3a8a" text-anchor="middle">
    <text x="205" y="83">RP⁰</text><text x="405" y="83">RP¹</text><text x="605" y="83">RP²</text><text x="830" y="83">⋯</text><text x="980" y="83">RPⁿ</text>
    <text x="225" y="230">CP⁰</text><text x="425" y="230">CP¹</text><text x="625" y="230">CP²</text><text x="830" y="230">⋯</text><text x="980" y="230">CPⁿ</text>
  </g>
  <g stroke="#374151" stroke-width="4" marker-end="url(#proj-arrow)">
    <line x1="255" y1="73" x2="350" y2="73"/><line x1="455" y1="73" x2="550" y2="73"/><line x1="655" y1="73" x2="770" y2="73"/><line x1="875" y1="73" x2="930" y2="73"/>
    <line x1="275" y1="220" x2="370" y2="220"/><line x1="475" y1="220" x2="570" y2="220"/><line x1="675" y1="220" x2="770" y2="220"/><line x1="875" y1="220" x2="930" y2="220"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#374151" text-anchor="middle">
    <text x="304" y="53">+ e¹</text><text x="504" y="53">+ e²</text><text x="718" y="53">+ e³</text><text x="902" y="53">+ eⁿ</text>
    <text x="324" y="200">+ e²</text><text x="524" y="200">+ e⁴</text><text x="722" y="200">+ e⁶</text><text x="902" y="200">+ e²ⁿ</text>
  </g>
  <text x="540" y="313" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#374151">RPⁿ memiliki satu sel pada setiap dimensi 0,…,n; CPⁿ satu sel pada dimensi 0,2,…,2n.</text>
</svg>
