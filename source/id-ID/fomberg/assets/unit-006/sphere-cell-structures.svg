  <title id="sphere-title">Dua struktur CW pada sfera</title>
  <desc id="sphere-desc">Baris atas membangun sfera dua dari satu verteks, satu sel satu berbentuk lingkaran, dan dua sel dua yang mengisi kedua sisi. Baris bawah membangun sfera n dari satu sel nol dan satu sel n yang seluruh batasnya dilekatkan ke sel nol.</desc>
