  <title id="brouwer-title">Sinar yang menghasilkan retraksi dalam bukti Brouwer</title>
  <desc id="brouwer-desc">Di dalam cakram, titik f dari x terletak di kanan atas titik x. Sinar dari f dari x melalui x diteruskan ke batas cakram dan bertemu pada r dari x.</desc>
  <rect x="0" y="0" width="560" height="440" fill="#ffffff"/>
  <circle cx="280" cy="220" r="170"
          fill="#f9fafb" stroke="#111827" stroke-width="5"/>
  <path d="M320 188 L144 320"
        fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="188" r="8" fill="#1d4ed8" stroke="#111827" stroke-width="2"/>
  <circle cx="240" cy="248" r="8" fill="#b91c1c" stroke="#111827" stroke-width="2"/>
  <circle cx="144" cy="320" r="8" fill="#111827"/>
  <text x="336" y="180" font-family="sans-serif" font-size="24" fill="#111827">f(x)</text>
  <text x="213" y="282" font-family="sans-serif" font-size="24" fill="#111827">x</text>
  <text x="92" y="354" font-family="sans-serif" font-size="24" fill="#111827">r(x)</text>
</svg>
