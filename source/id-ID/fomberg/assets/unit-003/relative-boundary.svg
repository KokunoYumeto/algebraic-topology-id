  <title id="relative-boundary-title">Batas dua relatif pada pasangan X dan A</title>
  <desc id="relative-boundary-desc">Ruang X dibatasi oleh kurva hitam dan subruang A adalah daerah biru di bawah kanan. Busur merah membatasi rantai dua di luar A. Kedua ujung busur dihubungkan oleh ruas biru putus-putus di dalam A, yang menjadi nol dalam hasil bagi relatif.</desc>
