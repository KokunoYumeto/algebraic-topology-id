  <title id="formal-chains-title">Dua rantai satu formal yang berbeda</title>
  <desc id="formal-chains-desc">Di dalam ruang X terdapat subruang biru A. Rantai sigma satu berwarna merah dan rantai sigma dua berwarna hijau mengikuti jalur yang sama di luar A. Di dalam A, sigma satu melalui setengah lingkaran atas, sedangkan sigma dua melalui setengah lingkaran bawah. Pola garis juga membedakan kedua rantai.</desc>
